<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文创工坊 · 火宫殿数字馆</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; }
        body { background-color: #1a1512; font-family: 'Noto Serif SC', serif; color: #2e241e; line-height: 1.6; }
        .scroll-container { width: 100%; min-height: 100vh; background: #fbf3e8; border-left: 16px solid #7a4a2e; border-right: 16px solid #7a4a2e; }
        .top-ornament, .bottom-ornament { height: 14px; background: linear-gradient(90deg, #b87c4b, #e6c8a6, #b87c4b); }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 50px; background: rgba(122,74,46,0.97);
            color: #f7efe4; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid #e6c8a6; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            flex-wrap: wrap; gap: 15px;
        }
        .logo h1 { font-family: 'ZCOOL XiaoWei', serif; font-size: 2.4rem; letter-spacing: 8px; color: #ffd99b; text-shadow: 4px 4px 0 #4a2c1a; }
        .logo span { font-size: 0.8rem; letter-spacing: 3px; color: #e0c7a8; display: block; font-weight: 300; }
        .nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
        .nav-links a { color: #f0ddc5; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 8px 0; border-bottom: 3px solid transparent; transition: all 0.25s ease; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { border-bottom-color: #ffb882; color: #ffe6c7; transform: translateY(-2px); }
        .page-header {
            padding: 50px 60px 35px; background: linear-gradient(135deg, #2b1d12 0%, #4e3322 100%);
            color: #f5e6d3; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .page-header h2 { font-family: 'ZCOOL XiaoWei', serif; font-size: 3rem; color: #ffcf8f; text-shadow: 3px 3px 0 #3a2416; letter-spacing: 4px; }
        .page-header p { color: #e3d0bb; font-size: 1.05rem; margin-top: 8px; }
        .back-home { display: inline-flex; align-items: center; gap: 8px; background: #ffb37a; color: #2b1d12; padding: 12px 28px; border-radius: 40px; text-decoration: none; font-weight: 700; transition: 0.2s; white-space: nowrap; }
        .back-home:hover { background: #ffcf8f; transform: scale(1.03); }

        .workshop { padding: 50px 60px 70px; max-width: 1100px; margin: 0 auto; }
        .step-card { background: #fff9f2; border-radius: 24px; padding: 35px 40px; margin-bottom: 30px; border: 2px solid #e3c9b0; box-shadow: 0 10px 24px rgba(90,60,40,0.1); }
        .step-card h3 { font-family: 'ZCOOL XiaoWei', serif; font-size: 1.8rem; color: #5a3420; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .step-card h3 .num { background: #b87c4b; color: #fff; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900; }

        .material-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
        .material-item {
            background: #fff6eb; border: 3px solid #e3c9b0; border-radius: 16px;
            padding: 18px 10px; text-align: center; cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .material-item:hover { border-color: #b87c4b; transform: translateY(-3px); }
        .material-item .ico { font-size: 2.4rem; margin-bottom: 8px; }
        .material-item .name { font-weight: 700; color: #3a2416; font-size: 0.95rem; }
        .material-item.selected { background: #ffe2c1; border-color: #b87c4b; box-shadow: 0 0 0 4px rgba(184,124,75,0.2); }

        .style-grid { display: flex; gap: 16px; flex-wrap: wrap; }
        .style-item {
            padding: 14px 28px; border-radius: 40px; border: 3px solid #e3c9b0;
            background: #fff6eb; cursor: pointer; font-weight: 700; color: #3a2416;
            transition: all 0.2s; user-select: none;
        }
        .style-item:hover { border-color: #b87c4b; }
        .style-item.selected { background: #b87c4b; color: #fff; border-color: #8b5a2b; }

        .gen-btn {
            background: #ffb37a; border: none; padding: 16px 50px; border-radius: 50px;
            font-weight: 900; color: #2b1d12; cursor: pointer; font-size: 1.2rem;
            letter-spacing: 2px; transition: 0.2s; font-family: 'Noto Serif SC', serif;
        }
        .gen-btn:hover { background: #ffcf8f; transform: scale(1.03); }
        .gen-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .preview-area {
            background: #fff9f2; border-radius: 24px; padding: 40px; border: 2px dashed #dbbd9c;
            text-align: center; min-height: 320px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 30px;
        }
        .preview-placeholder { color: #b8a18c; font-size: 1.1rem; }
        .preview-placeholder i { font-size: 4rem; display: block; margin-bottom: 16px; color: #dbbd9c; }

        .creative-card {
            width: 100%; max-width: 480px; background: #fff;
            border-radius: 20px; padding: 30px; box-shadow: 0 16px 40px rgba(90,60,40,0.2);
            border: 3px solid #e3c9b0; position: relative; overflow: hidden;
        }
        .creative-card::before {
            content: '火宫殿'; position: absolute; top: 15px; right: 20px;
            font-family: 'ZCOOL XiaoWei', serif; font-size: 1rem; color: #dbbd9c;
            letter-spacing: 3px; opacity: 0.6;
        }
        .creative-card .card-emoji { font-size: 6rem; margin-bottom: 16px; }
        .creative-card .card-title { font-family: 'ZCOOL XiaoWei', serif; font-size: 1.8rem; color: #5a3420; margin-bottom: 10px; }
        .creative-card .card-desc { color: #8b6b51; font-size: 0.95rem; margin-bottom: 20px; }
        .creative-card .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e3c9b0; padding-top: 16px; font-size: 0.85rem; color: #b87c4b; }

        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(30px);
            background: #3a2416; color: #ffe6c7; padding: 16px 40px; border-radius: 50px;
            font-weight: 600; box-shadow: 0 15px 30px rgba(0,0,0,0.6); opacity: 0;
            transition: 0.3s; pointer-events: none; z-index: 999;
            border: 2px solid #b87c4b; font-size: 1.05rem; max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: #4caf50; }
        .toast.err { border-color: #e53935; }

        .footer { background: #2b1d12; color: #bda78e; text-align: center; padding: 45px 30px; font-size: 0.95rem; border-top: 8px solid #b87c4b; }
        .footer i { color: #b87c4b; margin: 0 6px; }

        @media (max-width: 900px) {
            .navbar { flex-direction: column; padding: 15px 20px; }
            .page-header { padding: 40px 25px; }
            .page-header h2 { font-size: 2.2rem; }
            .workshop { padding: 30px 18px 50px; }
            .step-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="top-ornament"></div>
        <nav class="navbar">
            <div class="logo"><h1>火宫殿</h1><span>HUO GONG DIAN · 1577</span></div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="heritage.html">非遗技艺</a>
                <a href="tofu.html">臭豆腐工坊</a>
                <a href="creative.html" class="active">AI文创</a>
                <a href="temple-fair.html">云游庙会</a>
                <a href="museum.html">数字博物馆</a>
                <a href="snacks.html">小吃游戏</a>
                <a href="license.html">授权联名</a>
            </div>
        </nav>

        <div class="page-header">
            <div>
                <h2><i class="fas fa-wand-magic-sparkles"></i> AI文创工坊</h2>
                <p>选取火宫殿文化素材，搭配风格，AI辅助生成你的专属数字文创</p>
            </div>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>

        <div class="workshop">
            <div class="step-card">
                <h3><span class="num">1</span> 选择文化素材</h3>
                <p style="color:#8b6b51; margin-bottom:20px;">从火宫殿代表性元素中挑选一个作为文创主题</p>
                <div class="material-grid" id="materialGrid"></div>
            </div>

            <div class="step-card">
                <h3><span class="num">2</span> 选择设计风格</h3>
                <div class="style-grid" id="styleGrid"></div>
            </div>

            <div style="text-align:center; margin-top:10px;">
                <button class="gen-btn" id="genBtn" onclick="generateCreative()" disabled>
                    <i class="fas fa-magic"></i> AI 生成文创方案
                </button>
            </div>

            <div class="preview-area" id="previewArea">
                <div class="preview-placeholder">
                    <i class="fas fa-palette"></i>
                    选择素材与风格后，点击上方按钮生成你的文创方案
                </div>
            </div>
        </div>

        <footer class="footer">
            <p><i class="fas fa-fire"></i> 火宫殿 · 中华老字号 · 非遗数字馆 <i class="fas fa-fire"></i></p>
            <p style="margin-top:12px; font-size:0.9rem; opacity:0.7;">AI文创为概念演示，生成内容仅供文化体验参考</p>
        </footer>
        <div class="bottom-ornament"></div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const MATERIALS = [
            { id: 'stinky', name: '臭豆腐', icon: '🍢', desc: '国家级非遗技艺代表' },
            { id: 'gate', name: '火宫殿牌楼', icon: '🏛️', desc: '市级文物保护单位' },
            { id: 'opera', name: '庙会戏台', icon: '🎭', desc: '湘剧与民俗表演舞台' },
            { id: 'dragon', name: '火神庙会', icon: '🐉', desc: '国家级非遗庙会' },
            { id: 'sisters', name: '姊妹团子', icon: '🍡', desc: '八大传统小吃之一' },
            { id: 'incense', name: '火神香火', icon: '🪔', desc: '四百余年火庙文化' }
        ];

        const STYLES = [
            { id: 'guochao', name: '国潮复古', bg: '#8b2e2e', accent: '#ffd99b' },
            { id: 'minimal', name: '极简留白', bg: '#f5f0e8', accent: '#5a3420' },
            { id: 'neon', name: '赛博湘风', bg: '#1a1a2e', accent: '#ff6b9d' },
            { id: 'ink', name: '水墨丹青', bg: '#2b2b2b', accent: '#e8dcc8' }
        ];

        let selectedMaterial = null;
        let selectedStyle = null;

        let toastTimer = null;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (type ? ' ' + type : '');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function renderMaterials() {
            const grid = document.getElementById('materialGrid');
            grid.innerHTML = '';
            MATERIALS.forEach(m => {
                const div = document.createElement('div');
                div.className = 'material-item';
                div.innerHTML = `<div class="ico">${m.icon}</div><div class="name">${m.name}</div>`;
                div.onclick = () => {
                    document.querySelectorAll('.material-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedMaterial = m;
                    checkReady();
                };
                grid.appendChild(div);
            });
        }

        function renderStyles() {
            const grid = document.getElementById('styleGrid');
            grid.innerHTML = '';
            STYLES.forEach(s => {
                const div = document.createElement('div');
                div.className = 'style-item';
                div.textContent = s.name;
                div.onclick = () => {
                    document.querySelectorAll('.style-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedStyle = s;
                    checkReady();
                };
                grid.appendChild(div);
            });
        }

        function checkReady() {
            document.getElementById('genBtn').disabled = !(selectedMaterial && selectedStyle);
        }

        function generateCreative() {
            if (!selectedMaterial || !selectedStyle) return;
            const btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI 生成中…';

            const preview = document.getElementById('previewArea');
            preview.innerHTML = '<div class="preview-placeholder"><i class="fas fa-spinner fa-spin"></i><br>AI 正在融合火宫殿文化与设计风格…</div>';

            setTimeout(() => {
                const m = selectedMaterial;
                const s = selectedStyle;
                const titles = {
                    stinky: '臭豆腐·闻香系列',
                    gate: '牌楼·门神系列',
                    opera: '戏台·脸谱系列',
                    dragon: '庙会·龙腾系列',
                    sisters: '团子·团圆系列',
                    incense: '香火·祈福系列'
                };
                const descs = {
                    guochao: '以火宫殿红墙金瓦为灵感，国潮复古配色，适合帆布袋、冰箱贴与礼盒包装。',
                    minimal: '极简留白设计，突出文化符号本身，适合明信片、书签与办公文具。',
                    neon: '赛博朋克色调碰撞湖湘传统，年轻化表达，适合潮流T恤与手机壳。',
                    ink: '水墨质感呈现百年老号底蕴，适合茶具、折扇与高端伴手礼。'
                };
                preview.innerHTML = `
                    <div class="creative-card" style="background:${s.bg === '#f5f0e8' ? '#fffdf9' : s.bg}; border-color:${s.accent};">
                        <div class="card-emoji">${m.icon}</div>
                        <div class="card-title" style="color:${s.accent};">${titles[m.id] || m.name + '·文创系列'}</div>
                        <div class="card-desc" style="color:${s.accent}cc;">${descs[s.id]}</div>
                        <div class="card-footer" style="color:${s.accent}99; border-color:${s.accent}44;">
                            <span>火宫殿 × AI文创工坊</span>
                            <span>概念方案 · 仅供体验</span>
                        </div>
                    </div>
                    <p style="margin-top:20px; color:#8b6b51; font-size:0.9rem;">💡 这是AI辅助生成的概念方案，实际文创产品以火宫殿官方发布为准</p>
                `;
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> 重新生成';
                showToast('✨ 文创方案已生成！', 'ok');
            }, 1600);
        }

        window.onload = function() {
            renderMaterials();
            renderStyles();
        };
    </script>
</body>
</html>
