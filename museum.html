<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字博物馆 · 火宫殿数字馆</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; }
        body { background-color: #1a1512; font-family: 'Noto Serif SC', serif; color: #2e241e; line-height: 1.6; }
        .scroll-container { width: 100%; min-height: 100vh; background: #fbf3e8; border-left: 16px solid #7a4a2e; border-right: 16px solid #7a4a2e; }
        .top-ornament, .bottom-ornament { height: 14px; background: linear-gradient(90deg, #b87c4b, #e6c8a6, #b87c4b); }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 50px; background: rgba(122,74,46,0.97);
            color: #f7efe4; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid #e6c8a6; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            flex-wrap: wrap; gap: 15px;
        }
        .logo h1 { font-family: 'ZCOOL XiaoWei', serif; font-size: 2.4rem; letter-spacing: 8px; color: #ffd99b; text-shadow: 4px 4px 0 #4a2c1a; }
        .logo span { font-size: 0.8rem; letter-spacing: 3px; color: #e0c7a8; display: block; font-weight: 300; }
        .nav-links { display: flex; gap: 22px; flex-wrap: wrap; }
        .nav-links a { color: #f0ddc5; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 8px 0; border-bottom: 3px solid transparent; transition: all 0.25s ease; letter-spacing: 1px; }
        .nav-links a:hover, .nav-links a.active { border-bottom-color: #ffb882; color: #ffe6c7; transform: translateY(-2px); }
        .page-header {
            padding: 50px 60px 35px; background: linear-gradient(135deg, #2b1d12 0%, #4e3322 100%);
            color: #f5e6d3; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;
        }
        .page-header h2 { font-family: 'ZCOOL XiaoWei', serif; font-size: 3rem; color: #ffcf8f; text-shadow: 3px 3px 0 #3a2416; letter-spacing: 4px; }
        .page-header p { color: #e3d0bb; font-size: 1.05rem; margin-top: 8px; }
        .back-home { display: inline-flex; align-items: center; gap: 8px; background: #ffb37a; color: #2b1d12; padding: 12px 28px; border-radius: 40px; text-decoration: none; font-weight: 700; transition: 0.2s; white-space: nowrap; }
        .back-home:hover { background: #ffcf8f; transform: scale(1.03); }

        .museum { padding: 50px 60px 70px; max-width: 1100px; margin: 0 auto; }

        .timeline { position: relative; padding-left: 40px; }
        .timeline::before {
            content: ''; position: absolute; left: 14px; top: 0; bottom: 0;
            width: 4px; background: linear-gradient(180deg, #b87c4b, #e3c9b0); border-radius: 2px;
        }
        .era-block { position: relative; margin-bottom: 40px; }
        .era-block::before {
            content: ''; position: absolute; left: -33px; top: 6px;
            width: 18px; height: 18px; border-radius: 50%;
            background: #b87c4b; border: 4px solid #fbf3e8; box-shadow: 0 0 0 3px #dbbd9c;
        }
        .era-block h3 {
            font-family: 'ZCOOL XiaoWei', serif; font-size: 1.6rem; color: #5a3420;
            margin-bottom: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
            transition: color 0.2s;
        }
        .era-block h3:hover { color: #b87c4b; }
        .era-block h3 .year { background: #b87c4b; color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 0.9rem; font-family: 'Noto Serif SC', serif; }
        .era-block .era-brief { color: #8b6b51; font-size: 0.95rem; margin-bottom: 14px; }

        .exhibit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .exhibit-card {
            background: #fff9f2; border-radius: 16px; padding: 20px;
            border: 2px solid #e3c9b0; cursor: pointer; transition: all 0.25s;
        }
        .exhibit-card:hover { border-color: #b87c4b; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(90,60,40,0.15); }
        .exhibit-card .ex-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .exhibit-card h4 { font-size: 1.05rem; color: #5a3420; margin-bottom: 6px; }
        .exhibit-card p { font-size: 0.82rem; color: #8b6b51; }

        .detail-modal {
            position: fixed; inset: 0; background: rgba(26,21,18,0.85);
            display: none; align-items: center; justify-content: center; z-index: 500; padding: 20px;
        }
        .detail-modal.show { display: flex; }
        .modal-content {
            background: #fbf3e8; border-radius: 24px; max-width: 560px; width: 100%;
            padding: 40px; border: 3px solid #b87c4b; position: relative;
            max-height: 85vh; overflow-y: auto;
        }
        .modal-close {
            position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
            cursor: pointer; color: #b87c4b; background: none; border: none;
        }
        .modal-content .m-icon { font-size: 4rem; margin-bottom: 16px; text-align: center; }
        .modal-content h3 { font-family: 'ZCOOL XiaoWei', serif; font-size: 1.9rem; color: #5a3420; margin-bottom: 16px; text-align: center; }
        .modal-content p { color: #5a3f2c; line-height: 1.9; margin-bottom: 12px; }
        .modal-content .m-tag { display: inline-block; background: #dbbd9c; color: #3a2416; padding: 4px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 16px; }

        .footer { background: #2b1d12; color: #bda78e; text-align: center; padding: 45px 30px; font-size: 0.95rem; border-top: 8px solid #b87c4b; }
        .footer i { color: #b87c4b; margin: 0 6px; }

        @media (max-width: 900px) {
            .navbar { flex-direction: column; padding: 15px 20px; }
            .page-header { padding: 40px 25px; }
            .page-header h2 { font-size: 2.2rem; }
            .museum { padding: 30px 18px 50px; }
            .timeline { padding-left: 30px; }
            .era-block::before { left: -26px; }
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="top-ornament"></div>
        <nav class="navbar">
            <div class="logo"><h1>火宫殿</h1><span>HUO GONG DIAN · 1577</span></div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="heritage.html">非遗技艺</a>
                <a href="tofu.html">臭豆腐工坊</a>
                <a href="creative.html">AI文创</a>
                <a href="temple-fair.html">云游庙会</a>
                <a href="museum.html" class="active">数字博物馆</a>
                <a href="snacks.html">小吃游戏</a>
                <a href="license.html">授权联名</a>
            </div>
        </nav>

        <div class="page-header">
            <div>
                <h2><i class="fas fa-landmark"></i> 数字博物馆</h2>
                <p>沿着时间轴，穿越火宫殿四百四十余年的历史长廊</p>
            </div>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>

        <div class="museum">
            <div class="timeline" id="timeline"></div>
        </div>

        <div class="detail-modal" id="detailModal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <div class="m-icon" id="modalIcon"></div>
                <h3 id="modalTitle"></h3>
                <div style="text-align:center;"><span class="m-tag" id="modalTag"></span></div>
                <p id="modalText"></p>
            </div>
        </div>

        <footer class="footer">
            <p><i class="fas fa-fire"></i> 火宫殿 · 中华老字号 · 非遗数字馆 <i class="fas fa-fire"></i></p>
            <p style="margin-top:12px; font-size:0.9rem; opacity:0.7;">内容整理自公开史料与官方信息，仅供文化展示</p>
        </footer>
        <div class="bottom-ornament"></div>
    </div>

    <script>
        const ERAS = [
            {
                year: '1577', title: '始建火神庙', brief: '明万历五年，火神庙落成于长沙坡子街',
                exhibits: [
                    { icon: '🪔', name: '火神庙', tag: '始建', desc: '明万历五年（1577年），火神庙在坡子街建成，供奉火神祝融。四百余年来香火不绝，是火宫殿一切故事的起点。火神信仰与长沙百姓的生活紧密相连，祭火神、求平安的习俗延续至今。' },
                    { icon: '🏛️', name: '火宫殿牌楼', tag: '市级文保', desc: '火宫殿牌楼是坡子街的地标性建筑，被审定为长沙市重点文物保护单位。牌楼古色古香，见证了火宫殿从火神庙到民俗文化地标的数百年变迁。' }
                ]
            },
            {
                year: '1747', title: '清代重修扩建', brief: '乾隆年间重修，道光年间扩建，格局渐成',
                exhibits: [
                    { icon: '🏗️', name: '古戏台', tag: '清代建筑', desc: '火宫殿古戏台始建于清代，木结构飞檐翘角，是庙会戏曲演出的核心场所。湘剧、长沙弹词、评书在此轮番上演，戏台前的观众围了一层又一层，是长沙最鲜活的市井文化空间。' }
                ]
            },
            {
                year: '2008', title: '火宫殿庙会入选国家级非遗', brief: '庙会文化获国家级认定',
                exhibits: [
                    { icon: '🎭', name: '火宫殿庙会', tag: '国家级非遗', desc: '2008年，火宫殿庙会列入第二批国家级非物质文化遗产代表性项目名录（编号Ⅹ-84）。庙会集祭祀火神、戏曲演出、小吃展销、手工艺展示于一体，是湖湘民俗文化的集中呈现。每年腊月二十三至正月十五，火宫殿举行盛大庙会，延续四百余年的烟火气。' }
                ]
            },
            {
                year: '2021', title: '臭豆腐技艺入选国家级非遗', brief: '火宫殿臭豆腐制作技艺获最高级别认定',
                exhibits: [
                    { icon: '🍢', name: '臭豆腐制作技艺', tag: '国家级非遗', desc: '2021年，火宫殿臭豆腐制作技艺列入第五批国家级非物质文化遗产代表性项目名录（编号Ⅷ-276）。技艺含制卤、制坯、浸泡、炸制、制汤五大环节，卤水以香菇、鲜冬笋、浏阳豆豉、曲酒等二十余种原料发酵两年以上而成。闻起来臭，吃起来香，毛泽东、洛夫等名人曾品尝题词。' }
                ]
            },
            {
                year: '当代', title: '数字时代的火宫殿', brief: '非遗数字化、文创联名、云上庙会',
                exhibits: [
                    { icon: '💻', name: '数字非遗馆', tag: '数字化', desc: '湖南省商务厅牵头推进老字号数字化工程，火宫殿作为标杆老字号，正通过三维建模、AR/VR虚拟交互等技术进行文化资源的数字化复原与展示。数字博物馆、云游庙会等线上体验，让四百年的火宫殿在云端触手可及。' },
                    { icon: '🤝', name: '文创联名', tag: '品牌跨界', desc: '火宫殿与麦当劳、好伴礼、金湘权等品牌开展联名合作，推出国潮礼盒、潮牌联名等产品。臭豆腐礼盒、冰箱贴、香囊等国潮文创线上线下热销，让老字号以年轻的方式走进日常生活。' }
                ]
            }
        ];

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            ERAS.forEach(era => {
                const block = document.createElement('div');
                block.className = 'era-block';
                let exhibitsHtml = era.exhibits.map((ex, i) => `
                    <div class="exhibit-card" onclick="openModal('${era.year}', ${i})">
                        <div class="ex-icon">${ex.icon}</div>
                        <h4>${ex.name}</h4>
                        <p>${ex.tag}</p>
                    </div>
                `).join('');
                block.innerHTML = `
                    <h3><span class="year">${era.year}</span> ${era.title}</h3>
                    <p class="era-brief">${era.brief}</p>
                    <div class="exhibit-grid">${exhibitsHtml}</div>
                `;
                container.appendChild(block);
            });
        }

        function openModal(eraYear, exhibitIndex) {
            const era = ERAS.find(e => e.year === eraYear);
            if (!era) return;
            const ex = era.exhibits[exhibitIndex];
            if (!ex) return;
            document.getElementById('modalIcon').textContent = ex.icon;
            document.getElementById('modalTitle').textContent = ex.name;
            document.getElementById('modalTag').textContent = ex.tag;
            document.getElementById('modalText').textContent = ex.desc;
            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('detailModal').classList.remove('show');
        }

        window.onload = renderTimeline;
    </script>
</body>
</html>
