<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小吃接单挑战 · 火宫殿数字馆</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100vh; }
        body { background-color: #1a1512; font-family: 'Noto Serif SC', serif; color: #2e241e; line-height: 1.6; }
        .scroll-container { width: 100%; min-height: 100vh; background: #fbf3e8; border-left: 16px solid #7a4a2e; border-right: 16px solid #7a4a2e; }
        .top-ornament, .bottom-ornament { height: 14px; background: linear-gradient(90deg, #b87c4b, #e6c8a6, #b87c4b); }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 50px; background: rgba(122,74,46,0.97);
            color: #f7efe4; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid #e6c8a6; box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            flex-wrap: wrap; gap: 15px;
        }
        .logo h1 { font-family: 'ZCOOL XiaoWei', serif; font-size: 2.4rem; letter-spacing: 8px; color: #ffd99b; text-shadow: 4px 4px 0 #4a2c1a; }
        .logo span { font-size: 0.8rem; letter-spacing: 3px; color: #e0c7a8; display: block; font-weight: 300; }
        .nav-links { display: flex; gap: 30px; flex-wrap: wrap; }
        .nav-links a {
            color: #f0ddc5; text-decoration: none; font-weight: 600; font-size: 1.05rem;
            padding: 8px 0; border-bottom: 3px solid transparent; transition: all 0.25s ease; letter-spacing: 1px;
        }
        .nav-links a:hover, .nav-links a.active { border-bottom-color: #ffb882; color: #ffe6c7; transform: translateY(-2px); }
        .page-header {
            padding: 50px 60px 35px; background: linear-gradient(135deg, #2b1d12 0%, #4e3322 100%);
            color: #f5e6d3; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px;
        }
        .page-header h2 { font-family: 'ZCOOL XiaoWei', serif; font-size: 3rem; color: #ffcf8f; text-shadow: 3px 3px 0 #3a2416; letter-spacing: 4px; }
        .page-header p { color: #e3d0bb; font-size: 1.05rem; margin-top: 8px; }
        .back-home {
            display: inline-flex; align-items: center; gap: 8px;
            background: #ffb37a; color: #2b1d12; padding: 12px 28px; border-radius: 40px;
            text-decoration: none; font-weight: 700; transition: 0.2s; white-space: nowrap;
        }
        .back-home:hover { background: #ffcf8f; transform: scale(1.03); }

        /* 游戏区 */
        .game-section { padding: 50px 60px 70px; }
        .game-panel {
            max-width: 1150px; margin: 0 auto; background: #fff9f2;
            border-radius: 30px; padding: 40px; box-shadow: 0 16px 40px rgba(90,60,40,0.2);
            border: 2px solid #e3c9b0;
        }
        .game-topbar {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 20px; margin-bottom: 30px;
            background: #4a2c1a; color: #f5e6d3; padding: 18px 30px; border-radius: 50px;
        }
        .hud { display: flex; gap: 35px; flex-wrap: wrap; align-items: center; }
        .hud-item { text-align: center; }
        .hud-label { font-size: 0.8rem; color: #c8b09b; letter-spacing: 1px; }
        .hud-value { font-size: 1.8rem; font-weight: 900; color: #ffbc7a; line-height: 1.2; }
        .hud-value.warn { color: #ff7b7b; animation: flash 0.5s infinite; }
        @keyframes flash { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .game-btn {
            background: #ffb37a; border: none; padding: 12px 35px; border-radius: 40px;
            font-weight: 700; color: #2b1d12; cursor: pointer; transition: 0.2s;
            font-size: 1rem; letter-spacing: 1px; font-family: 'Noto Serif SC', serif;
        }
        .game-btn:hover { background: #ffcf8f; transform: scale(1.03); }
        .game-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .order-box {
            background: #ffe9d2; border: 2px dashed #b87c4b; border-radius: 20px;
            padding: 25px 30px; margin-bottom: 30px; text-align: center;
        }
        .order-box h3 { font-family: 'ZCOOL XiaoWei', serif; font-size: 1.6rem; color: #5a3420; margin-bottom: 14px; }
        .order-items { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
        .order-item {
            background: #fff; padding: 12px 24px; border-radius: 16px;
            border: 2px solid #dbbd9c; font-weight: 700; color: #5a3420;
            font-size: 1.15rem; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .order-item.done { background: #c8e6c9; border-color: #4caf50; color: #2e7d32; text-decoration: line-through; opacity: 0.75; }

        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
        .menu-item {
            background: #fff6eb; padding: 22px 12px; border-radius: 60px 60px 25px 25px;
            text-align: center; box-shadow: 0 8px 0 #dbbd9c; transition: all 0.1s ease;
            cursor: pointer; user-select: none; border: 2px solid transparent;
        }
        .menu-item:hover { border-color: #b87c4b; }
        .menu-item:active { transform: translateY(5px); box-shadow: 0 3px 0 #dbbd9c; }
        .menu-item .food-icon { font-size: 3rem; margin-bottom: 10px; }
        .menu-item h4 { font-size: 1.1rem; color: #3a2416; margin-bottom: 6px; }
        .menu-item .price { color: #b35e1a; font-weight: 700; }
        .menu-item.correct { background: #c8e6c9; border-color: #4caf50; }
        .menu-item.wrong { background: #ffcdd2; border-color: #e53935; animation: shake 0.3s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .menu-item.disabled { pointer-events: none; opacity: 0.5; }

        .result-box {
            margin-top: 35px; background: #4a2c1a; color: #f5e6d3; padding: 30px 35px;
            border-radius: 25px; text-align: center; display: none;
        }
        .result-box.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-box h3 { font-family: 'ZCOOL XiaoWei', serif; font-size: 2.2rem; color: #ffcf8f; margin-bottom: 12px; }
        .result-box p { font-size: 1.1rem; color: #e3d0bb; margin-bottom: 10px; }
        .result-box .final-score { font-size: 3rem; font-weight: 900; color: #ffbc7a; }
        .result-box .rank { font-size: 1.35rem; color: #ffb882; margin: 12px 0 22px; }

        .toast {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(30px);
            background: #3a2416; color: #ffe6c7; padding: 16px 40px; border-radius: 50px;
            font-weight: 600; box-shadow: 0 15px 30px rgba(0,0,0,0.6); opacity: 0;
            transition: 0.3s; pointer-events: none; z-index: 999;
            border: 2px solid #b87c4b; font-size: 1.05rem; max-width: 90vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.ok { border-color: #4caf50; }
        .toast.err { border-color: #e53935; }

        .footer { background: #2b1d12; color: #bda78e; text-align: center; padding: 45px 30px; font-size: 0.95rem; border-top: 8px solid #b87c4b; }
        .footer i { color: #b87c4b; margin: 0 6px; }

        @media (max-width: 900px) {
            .navbar { flex-direction: column; padding: 15px 20px; }
            .game-section, .page-header { padding: 40px 18px; }
            .game-panel { padding: 25px 18px; }
            .page-header h2 { font-size: 2.2rem; }
            .hud { gap: 20px; }
            .game-topbar { padding: 16px 20px; }
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="top-ornament"></div>
        <nav class="navbar">
            <div class="logo"><h1>火宫殿</h1><span>HUO GONG DIAN · 1577</span></div>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="heritage.html">非遗技艺</a>
                <a href="tofu.html">臭豆腐工坊</a>
                <a href="opera.html">庙会戏台</a>
                <a href="snacks.html" class="active">小吃游戏</a>
            </div>
        </nav>

        <div class="page-header">
            <div>
                <h2><i class="fas fa-gamepad"></i> 小吃接单挑战</h2>
                <p>30 秒内按顾客订单准确点击小吃，考验手速与记忆力！</p>
            </div>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>

        <section class="game-section">
            <div class="game-panel">
                <!-- 状态栏 -->
                <div class="game-topbar">
                    <div class="hud">
                        <div class="hud-item">
                            <div class="hud-label">剩余时间</div>
                            <div class="hud-value" id="timeLeft">30</div>
                        </div>
                        <div class="hud-item">
                            <div class="hud-label">得分</div>
                            <div class="hud-value" id="score">0</div>
                        </div>
                        <div class="hud-item">
                            <div class="hud-label">连击</div>
                            <div class="hud-value" id="combo">0</div>
                        </div>
                        <div class="hud-item">
                            <div class="hud-label">完成订单</div>
                            <div class="hud-value" id="ordersDone">0</div>
                        </div>
                    </div>
                    <button class="game-btn" id="startBtn" onclick="startGame()">开始挑战</button>
                </div>

                <!-- 顾客订单 -->
                <div class="order-box">
                    <h3 id="orderTitle">🛎️ 点击"开始挑战"接单</h3>
                    <div class="order-items" id="orderItems"></div>
                </div>

                <!-- 小吃菜单 -->
                <div class="menu-grid" id="menuGrid"></div>

                <!-- 结算 -->
                <div class="result-box" id="resultBox">
                    <h3>挑战结束</h3>
                    <p>最终得分</p>
                    <div class="final-score" id="finalScore">0</div>
                    <div class="rank" id="rankText"></div>
                    <button class="game-btn" onclick="startGame()"><i class="fas fa-rotate-right"></i> 再玩一次</button>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p><i class="fas fa-fire"></i> 火宫殿 · 中华老字号 · 非遗数字馆 <i class="fas fa-fire"></i></p>
            <p style="margin-top:12px; font-size:0.9rem; opacity:0.7;">地址：长沙市天心区坡子街127号 | 始于1577年</p>
        </footer>
        <div class="bottom-ornament"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ========== 数据 ========== */
        const FOODS = [
            { name: '臭豆腐', icon: '🍢', price: 12 },
            { name: '姊妹团子', icon: '🍡', price: 10 },
            { name: '龙脂猪血', icon: '🥣', price: 9 },
            { name: '糖油粑粑', icon: '🥠', price: 8 },
            { name: '葱油粑粑', icon: '🧅', price: 7 },
            { name: '肉丝馓子', icon: '🍜', price: 11 }
        ];

        /* ========== 状态 ========== */
        let state = {
            running: false,
            timeLeft: 30,
            score: 0,
            combo: 0,
            ordersDone: 0,
            currentOrder: [],   // 当前订单的小吃名数组
            orderRemaining: [], // 尚未点中的
            timerId: null
        };

        let toastTimer = null;
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (type ? ' ' + type : '');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 1800);
        }

        /* ========== 渲染菜单 ========== */
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            FOODS.forEach(food => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.dataset.name = food.name;
                div.innerHTML = `<div class="food-icon">${food.icon}</div><h4>${food.name}</h4><div class="price">¥${food.price}</div>`;
                div.onclick = () => onPickFood(food.name);
                grid.appendChild(div);
            });
        }

        /* ========== 生成订单 ========== */
        function newOrder() {
            // 每单随机 2-3 种不同小吃
            const count = Math.random() < 0.5 ? 2 : 3;
            const shuffled = FOODS.slice().sort(() => Math.random() - 0.5);
            const order = shuffled.slice(0, count).map(f => f.name);
            state.currentOrder = order;
            state.orderRemaining = order.slice();
            renderOrder();
        }

        function renderOrder() {
            const title = document.getElementById('orderTitle');
            const items = document.getElementById('orderItems');
            if (state.currentOrder.length === 0) {
                title.textContent = '🛎️ 点击"开始挑战"接单';
                items.innerHTML = '';
                return;
            }
            title.textContent = '🛎️ 顾客订单：请点击对应小吃';
            items.innerHTML = '';
            state.currentOrder.forEach(name => {
                const food = FOODS.find(f => f.name === name);
                const done = !state.orderRemaining.includes(name);
                const div = document.createElement('div');
                div.className = 'order-item' + (done ? ' done' : '');
                div.innerHTML = `<span>${food.icon}</span><span>${name}</span>`;
                items.appendChild(div);
            });
        }

        /* ========== 点击小吃 ========== */
        function onPickFood(name) {
            if (!state.running) {
                showToast('先点击"开始挑战"接单哦～');
                return;
            }
            const el = document.querySelector(`.menu-item[data-name="${name}"]`);
            if (!el) return;

            if (state.orderRemaining.includes(name)) {
                // 正确
                state.orderRemaining = state.orderRemaining.filter(n => n !== name);
                state.combo++;
                const gain = 10 + (state.combo - 1) * 2; // 连击加成
                state.score += gain;
                el.classList.add('correct');
                setTimeout(() => el.classList.remove('correct'), 400);
                showToast(`✅ ${name} +${gain} 分` + (state.combo > 1 ? `（连击 x${state.combo}）` : ''), 'ok');
                updateHUD();
                renderOrder();

                if (state.orderRemaining.length === 0) {
                    // 订单完成
                    state.ordersDone++;
                    state.score += 20; // 完成订单奖励
                    showToast('🎉 订单完成！奖励 20 分', 'ok');
                    updateHUD();
                    setTimeout(() => {
                        if (state.running) newOrder();
                    }, 500);
                }
            } else {
                // 错误
                state.combo = 0;
                state.score = Math.max(0, state.score - 5);
                el.classList.add('wrong');
                setTimeout(() => el.classList.remove('wrong'), 500);
                showToast(`❌ 订单里没有 ${name}，-5 分`, 'err');
                updateHUD();
            }
        }

        /* ========== HUD ========== */
        function updateHUD() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('combo').textContent = state.combo;
            document.getElementById('ordersDone').textContent = state.ordersDone;
            const timeEl = document.getElementById('timeLeft');
            timeEl.textContent = state.timeLeft;
            timeEl.classList.toggle('warn', state.timeLeft <= 10 && state.running);
        }

        /* ========== 开始游戏 ========== */
        function startGame() {
            // 重置
            if (state.timerId) clearInterval(state.timerId);
            state = {
                running: true,
                timeLeft: 30,
                score: 0,
                combo: 0,
                ordersDone: 0,
                currentOrder: [],
                orderRemaining: [],
                timerId: null
            };
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').textContent = '挑战中…';
            updateHUD();
            newOrder();
            showToast('🔥 挑战开始！按订单点击小吃', 'ok');

            state.timerId = setInterval(() => {
                state.timeLeft--;
                updateHUD();
                if (state.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        /* ========== 结束游戏 ========== */
        function endGame() {
            state.running = false;
            clearInterval(state.timerId);
            state.timerId = null;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').textContent = '重新开始';

            const box = document.getElementById('resultBox');
            document.getElementById('finalScore').textContent = state.score;
            let rank = '';
            if (state.score >= 200) rank = '🏆 火宫殿金牌跑堂！';
            else if (state.score >= 120) rank = '🥇 熟练伙计，手脚麻利！';
            else if (state.score >= 60) rank = '🥈 学徒水平，继续加油！';
            else rank = '🥉 刚入门，多练练手速吧～';
            document.getElementById('rankText').textContent = rank;
            box.classList.add('show');
            showToast('⏰ 时间到！最终得分 ' + state.score, 'ok');
        }

        /* ========== 初始化 ========== */
        window.onload = function () {
            renderMenu();
            updateHUD();
        };
    </script>
</body>
</html>
